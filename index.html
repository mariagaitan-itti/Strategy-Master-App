    const MindMapBranch = ({ node, onNavigate, parentLineColor = "bg-gray-700", isFirst = true, isLast = true, onToggle, level = 1 }) => {

    const MindMapV2 = ({ data, onNavigate }) => {
      const [scale, setScale] = useState(1);
      const [isDragging, setIsDragging] = useState(false);
      const [startX, setStartX] = useState(0);
      const [startY, setStartY] = useState(0);
      const scrollRef = useRef(null);
      const contentRef = useRef(null);

      const fitToScreen = () => {
        if (!scrollRef.current || !contentRef.current) return;
        const viewW = scrollRef.current.clientWidth;
        const viewH = scrollRef.current.clientHeight;
        
        const realContentW = contentRef.current.offsetWidth;
        const realContentH = contentRef.current.offsetHeight;

        const padding = 100;
        const scaleX = (viewW - padding) / realContentW;
        const scaleY = (viewH - padding) / realContentH;
        
        let newScale = Math.min(scaleX, scaleY, 1.2);
        if(newScale < 0.2) newScale = 0.2;
        
        setScale(newScale);
        
        setTimeout(() => {
          if(scrollRef.current) {
            const scrollW = scrollRef.current.scrollWidth;
            const scrollH = scrollRef.current.scrollHeight;
            scrollRef.current.scrollLeft = (scrollW - viewW) / 2;
            scrollRef.current.scrollTop = (scrollH - viewH) / 2;
          }
        }, 50);
      };

      useEffect(() => {
        setTimeout(fitToScreen, 100);

        const el = scrollRef.current;
        if (!el) return;

        const handleWheel = (e) => {
          e.preventDefault();
          if (e.ctrlKey) {
            const zoomSensitivity = 0.005;
            setScale(prevScale => {
              const newScale = prevScale - (e.deltaY * zoomSensitivity);
              return Math.min(Math.max(newScale, 0.2), 3);
            });
          } else {
            if (scrollRef.current) {
              scrollRef.current.scrollLeft += e.deltaX;
              scrollRef.current.scrollTop += e.deltaY;
            }
          }
        };

        el.addEventListener('wheel', handleWheel, { passive: false });
        return () => el.removeEventListener('wheel', handleWheel);
      }, []);

      const onMouseDown = (e) => {
        setIsDragging(true);
        setStartX(e.pageX - scrollRef.current.offsetLeft);
        setStartY(e.pageY - scrollRef.current.offsetTop);
      };

      const onMouseLeaveOrUp = () => setIsDragging(false);

      const onMouseMove = (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.pageX - scrollRef.current.offsetLeft;
        const y = e.pageY - scrollRef.current.offsetTop;
        const walkX = (x - startX) * 1.5; 
        const walkY = (y - startY) * 1.5;
        scrollRef.current.scrollLeft -= walkX;
        scrollRef.current.scrollTop -= walkY;
        setStartX(x);
        setStartY(y);
      };

      return (
        <div className="relative w-full h-[calc(100vh-280px)] min-h-[500px] border border-gray-800 rounded-3xl bg-[#111827] shadow-inner overflow-hidden flex flex-col">
          
          <div className="absolute top-4 right-4 z-50 flex items-center space-x-1 bg-[#1E293B]/90 backdrop-blur-sm p-1.5 rounded-xl border border-gray-700 shadow-lg">
            <button onClick={() => setScale(s => Math.max(s - 0.15, 0.2))} className="p-2 text-gray-400 hover:text-white hover:bg-gray-700 rounded-lg transition-colors" title="Alejar">
              <Icons.ZoomOut />
            </button>
            <button onClick={fitToScreen} className="px-3 py-1.5 text-xs font-bold text-gray-300 hover:text-white hover:bg-gray-700 rounded-lg transition-colors" title="Ajustar a pantalla">
              {Math.round(scale * 100)}%
            </button>
            <button onClick={() => setScale(s => Math.min(s + 0.15, 3))} className="p-2 text-gray-400 hover:text-white hover:bg-gray-700 rounded-lg transition-colors" title="Acercar">
              <Icons.ZoomIn />
            </button>
          </div>

          <div 
            ref={scrollRef}
            className={`flex-1 overflow-auto drag-area relative ${isDragging ? 'cursor-grabbing' : 'cursor-grab'}`}
            onMouseDown={onMouseDown}
            onMouseLeave={onMouseLeaveOrUp}
            onMouseUp={onMouseLeaveOrUp}
            onMouseMove={onMouseMove}
          >
            <div 
              className="zoom-content inline-block p-20 min-w-max min-h-max" 
              style={{ transform: `scale(${scale})`, transformOrigin: 'center center' }}
            >
              <div className="flex items-center" ref={contentRef}>
                
                <div className="flex-shrink-0 z-10 relative">
                  <div className="bg-gradient-to-br from-[#00E58F] to-emerald-600 text-gray-900 px-6 py-5 rounded-2xl shadow-[0_0_30px_rgba(0,229,143,0.25)] border border-[#00E58F]/50 flex flex-col items-center">
                    <div className="flex items-center gap-2 mb-1">
                      <ProductLogo logoUrl="https://www.google.com/s2/favicons?domain=ueno.com.py&sz=128" alt="ueno" className="w-6 h-6 mr-2" />
                      <span className="font-extrabold text-xl tracking-tight">Super App</span>
                    </div>
                    <span className="text-xs font-bold uppercase tracking-widest opacity-80">Life Partner</span>
                  </div>
                </div>

                <div className="w-10 h-0.5 bg-gray-600 shrink-0"></div>

                <div className="flex flex-col justify-center relative">
                  {data.map((node, i) => (
                    <MindMapBranch 
                      key={i} 
                      node={node} 
                      onNavigate={onNavigate} 
                      parentLineColor="bg-gray-600"
                      isFirst={i === 0}
                      isLast={i === data.length - 1}
                      onToggle={fitToScreen} 
                    />
                  ))}
                </div>

              </div>
            </div>
          </div>
          
        </div>
      );
    };

                  <div className="md:hidden mb-4">

                  <div className="bg-[#1E293B]/50 border border-gray-800 rounded-2xl p-6 mt-6 md:mt-0">

                    </p>
                    
                    <div>
                      <div className="flex items-center space-x-2 mb-3">

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {activeProduct?.transversal?.map((metric, idx) => (

                    <div className="space-y-4">

        </div>
